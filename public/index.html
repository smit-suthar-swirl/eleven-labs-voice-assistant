<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BYD Shark 6 - Voice Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .hero {
      text-align: center;
      color: white;
      max-width: 600px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      font-weight: 700;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    p {
      font-size: 20px;
      margin-bottom: 40px;
      opacity: 0.95;
      line-height: 1.6;
    }

    .cta-button {
      background: white;
      color: #667eea;
      padding: 20px 50px;
      border: none;
      border-radius: 50px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .cta-button:active {
      transform: translateY(-1px);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
      margin-top: 60px;
    }

    .feature {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .feature-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .feature h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .feature p {
      font-size: 14px;
      margin: 0;
      opacity: 0.9;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 32px;
      }

      p {
        font-size: 16px;
      }

      .cta-button {
        padding: 16px 36px;
        font-size: 18px;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🚗 BYD Shark 6</h1>
    <p>Talk to our AI assistant about Australia's revolutionary plug-in hybrid pickup truck</p>

    <button class="cta-button" onclick="openAssistant()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
      Start Conversation
    </button>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">💬</div>
        <h3>Natural Conversation</h3>
        <p>Speak naturally, get instant answers</p>
      </div>

      <div class="feature">
        <div class="feature-icon">🎤</div>
        <h3>Voice Powered</h3>
        <p>Hands-free, just talk</p>
      </div>

      <div class="feature">
        <div class="feature-icon">🧠</div>
        <h3>AI Assistant</h3>
        <p>Powered by Claude AI</p>
      </div>

      <div class="feature">
        <div class="feature-icon">⚡</div>
        <h3>Real-time</h3>
        <p>Instant responses</p>
      </div>
    </div>
  </div>

  <!-- Load Voice Assistant -->
  <script src="/client/modal-chat.js?v=4"></script>
  <script src="/client/webrtc-connection.js?v=4"></script>
  <script src="/client/webrtc-client.js?v=4"></script>
  <script src="/client/audio-processor.js?v=4"></script>
  <script src="/client/vad-handler.js?v=4"></script>
  <script>
    let modal = null;
    let webrtc = null;
    let audio = null;
    let vad = null;
    let isActive = false;

    function init() {
      modal = new ModalChat({ primaryColor: '#075e54' });
      modal.createModal();

      audio = new AudioProcessor();
      webrtc = new WebRTCClient(window.location.origin);
      vad = new VADHandler();

      // Activate
      modal.on('activate', async () => {
        console.log('🔥 ACTIVATE EVENT FIRED, isActive:', isActive);
        if (isActive) {
          console.warn('⚠️ Already active, skipping');
          return;
        }
        try {
          console.log('🎤 Step 1: Requesting mic permission...');
          await audio.requestMicrophonePermission();
          console.log('✅ Step 1 complete: Mic permission granted');

          console.log('🔌 Step 2: Connecting WebRTC...');
          await webrtc.connect();
          console.log('✅ Step 2 complete: WebRTC connected');

          console.log('🎤 Step 3: Starting audio capture...');
          audio.startCapture((chunk) => {
            webrtc.sendAudioChunk(chunk);
          });
          console.log('✅ Step 3 complete: Audio capture started');

          console.log('🎙️ Step 4: Starting VAD...');
          vad.start(audio.getAudioStream());
          console.log('✅ Step 4 complete: VAD started');

          isActive = true;
          modal.setState('listening');
          console.log('✅ ALL STEPS COMPLETE - LISTENING');
        } catch (err) {
          console.error('❌ Activation failed:', err);
          modal.showError('Microphone access denied');
        }
      });

      // Deactivate
      modal.on('deactivate', () => {
        if (!isActive) return;
        vad.stop();
        audio.stopCapture();
        audio.stopPlayback();
        webrtc.disconnect();
        isActive = false;
        modal.setState('idle');
      });

      // Audio playback
      webrtc.on('audioChunk', (chunk) => {
        audio.playAudio(chunk);
      });

      // State updates
      webrtc.on('stateChange', (state) => {
        modal.setState(state);
      });

      // Transcript - Add to chat
      webrtc.on('transcript', (data) => {
        modal.addMessage(data.text, data.role);
      });

      // Errors
      webrtc.on('error', (message) => {
        modal.showError(message);
      });

      // Interruption
      vad.on('speechStart', () => {
        if (modal.currentState === 'speaking') {
          audio.stopPlayback();
          webrtc.sendInterruption();
          modal.setState('listening');
        }
      });
    }

    function openAssistant() {
      if (!modal) init();
      modal.open();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
